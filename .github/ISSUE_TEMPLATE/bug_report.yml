name: Bug report
description: Report a reproducible component or client failure.
labels: ["type:bug", "status:needs-triage"]
body:
  - type: input
    id: package_version
    attributes:
      label: Package version
      placeholder: Package version or unreleased commit SHA
    validations:
      required: true
  - type: input
    id: convex_version
    attributes:
      label: Convex version
    validations:
      required: true
  - type: input
    id: node_version
    attributes:
      label: Node.js version
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Convex runtime
      options: [Convex cloud, Self-hosted, Local backend]
    validations:
      required: true
  - type: textarea
    id: sync_status
    attributes:
      label: Sync status (sync.status)
      description: Paste sync.status when available; remove private values.
    validations:
      required: false
  - type: input
    id: last_successful_sync
    attributes:
      label: Last successful sync
      description: Timestamp, “never”, or “unknown”.
    validations:
      required: false
  - type: input
    id: sync_source
    attributes:
      label: Sync source
      description: Configured catalog source when relevant.
    validations:
      required: false
  - type: input
    id: provider_model_ids
    attributes:
      label: Provider and model IDs
      description: Public provider and model IDs when relevant.
    validations:
      required: false
  - type: textarea
    id: sync_guards_config
    attributes:
      label: Sync guards or configuration context
      description: Guard values and sync settings when relevant; remove private values.
    validations:
      required: false
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the smallest code or steps that reproduce the issue. Redact sensitive data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Optional logs
      description: Remove credentials, prompts, usage data and customer data.
    validations:
      required: false
  - type: checkboxes
    id: issue_search
    attributes:
      label: Existing reports
      options:
        - label: I searched existing issues and discussions.
          required: true
